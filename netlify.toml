[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Rewrite rule to proxy frontend API requests to the Netlify Serverless Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Fallback rule for React Router client-side routing (Single Page Application)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
